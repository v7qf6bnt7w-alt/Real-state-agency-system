<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Verify sign-in — Estate North</title>
<style>body{margin:0;background:#f5f5f0;color:#20231e;font:14px Arial,sans-serif;min-height:100vh;display:grid;place-items:center}.card{width:min(390px,calc(100% - 40px));background:white;padding:38px;box-shadow:0 16px 50px #20231e12}.eyebrow{color:#657767;text-transform:uppercase;letter-spacing:1.5px;font-size:10px}h1{font:500 32px Georgia,serif;margin:14px 0}p{color:#74776f;line-height:1.6;font-size:13px}label{font-size:11px;display:block;margin:25px 0 7px}input{box-sizing:border-box;width:100%;padding:13px;border:1px solid #d8d9d2;font-size:18px;letter-spacing:5px}button{margin-top:17px;width:100%;border:0;background:#29463a;color:white;padding:14px;cursor:pointer}.error{color:#a63131}</style></head>
<body><main class="card"><div class="eyebrow">Estate North staff</div><h1>Verify it’s you.</h1><p>Enter the six-digit code sent to your registered contact. The code expires in 10 minutes.</p>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post">{% csrf_token %}<label for="id_code">Verification code</label>{{ form.code }}{% if form.code.errors %}<p class="error">{{ form.code.errors|striptags }}</p>{% endif %}<button type="submit">Verify and continue</button></form></main></body></html>
